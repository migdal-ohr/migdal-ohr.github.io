# Builds the Windows installer on a real Windows machine and attaches it to a GitHub Release.
# Run it from the Actions tab, or push a tag like v3.0.1.
name: Windows app
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:desktop
        env:
          TARGET: desktop
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: release/*.exe }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: release/*.exe }
