# Builds the Windows installer on a real Windows machine whenever the code on main changes,
# and publishes it as a GitHub Release named after package.json's version (v3.0.0, v3.0.1, …).
name: Windows app
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: windows-app, cancel-in-progress: true }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
        env:
          TARGET: desktop
          # links sent to parents (RSVP / registration) point at the public website
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && format('https://{0}', github.event.repository.name) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name)) }}
      - run: npx electron-builder --win nsis --x64 --publish never
      - id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: רישום מגדל אור ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            להתקנה: מורידים את הקובץ Migdal-Ohr-Rishum-Setup-${{ steps.v.outputs.version }}.exe ופותחים אותו.
            אם Windows מציג "Windows הגן על המחשב שלך": לוחצים "מידע נוסף" ואז "הפעל בכל זאת".
          files: release/*.exe
          overwrite_files: true
